seed: [0, 1, 2, 3, 4]
problem:
  m: 250
  n: 500
  A: {type: gaussian, col_norm: 1.0}
  sparsity_p: 0.10
  amplitude: {type: gaussian, std: 1.0}
  snr_db: 30
  lam: 0.1
  eps_rel: 1.0e-2
head:
  type: lista_cp
  K: 8
  target: xhat
  loss: last
  train: {n_train: 51200, batch: 64, lr: 5.0e-4, epochs_per_layer: 2, layerwise: true}
tail:
  type: elastic_net_ista
  mu: auto
  eps_tol_rel: [1.0e-2, 1.0e-3, 1.0e-4]
  max_iter: 100000
eval:
  n_test: 1000
  dtype_tail: float64
